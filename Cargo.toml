[package]
name = "donsetch"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Web fetch, search and crawl for AI agents. Custom stealthy HTTP fetch tier on BoringSSL."

[dependencies]
boring = { version = "5", features = ["mlkem"] }
boring-sys = "5"
foreign-types = "0.5"
tokio-boring = "5"
tokio = { version = "1", features = ["full"] }
url = "2"
brotli = "7"
flate2 = "1"
zstd = "0.13"
rustls-native-certs = "0.8"
scraper = "0.27.0"
encoding_rs = "0.8.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.26"
futures-util = "0.3"
libc = "0.2"
dirs = "6"
unicode-bidi = "0.3"
# OCR tier (Tier B) — PP-OCR via ONNX Runtime, lazy model cache.
oar-ocr = { version = "0.9", default-features = false, features = ["download-binaries", "simd"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
sha2 = { version = "0.10", optional = true }

[features]
default = ["ocr"]
ocr = ["dep:oar-ocr", "dep:image", "dep:reqwest", "dep:sha2"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Foundation"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
