# DonSeTch CI — build + test on Linux, macOS, Windows.
#
# The heavy dependencies need platform-specific setup:
#   boring-sys (BoringSSL): CMake + C/C++ compiler + Go + bindgen (libclang)
#   PDFium (static):         curl + tar (build.rs downloads at build time)
#   oar-ocr (ONNX Runtime):  download-binaries feature fetches at build time
#
# boring-sys needs Go because BoringSSL's build system is Go-based.
# It needs NASM for x86_64 assembly crypto. On Windows it needs
# LLVM/Clang for bindgen (pre-installed on Linux/macOS runners).
#
# Reference: cloudflare/boring CI for the toolchain setup pattern.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # ── build + test matrix ──────────────────────────────────────
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22.0'

      - name: Install NASM (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install NASM (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install nasm

      - name: Install NASM (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install nasm -y
        shell: cmd

      - name: Install LLVM (Windows)
        if: matrix.os == 'windows-latest'
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: "11.0"
          directory: ${{ runner.temp }}/llvm

      - name: Set LIBCLANG_PATH (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $clang = (Get-Command clang).Source
          $libclangPath = Split-Path $clang
          "LIBCLANG_PATH=$libclangPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Add NASM to PATH (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Test
        run: cargo test --release --target ${{ matrix.target }}

  # ── lint ─────────────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22.0'

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy

      - name: Clippy
        run: cargo clippy --release -- -Dwarnings

  # ── format check ─────────────────────────────────────────────
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
